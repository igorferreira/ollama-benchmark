        },
        "additionalProperties": false,
        "description": "Tentativa mais recente. Tokens gerais só finais; saída observada opcional via logprobs é provisória. Prévia volátil pode permanecer incompleta após falha/cancelamento. Não armazena thinking nem logprobs brutos."
      },
