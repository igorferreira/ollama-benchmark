    "/api/start": {
      "post": {
        "operationId": "startBenchmark",
        "summary": "Aceita e inicia comparação sequencial.",
        "description": "202 não confirma existência/capacidade do modelo; falhas assíncronas aparecem no estado. Novo job substitui resultados anteriores. Header X-Benchmark-Token vem de GET /. Content-Length obrigatório, corpo máximo65536bytes, sem Transfer-Encoding. POST não aceita query no caminho.",
        "security": [
          {
            "PageToken": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StartRequest"
              },
              "example": {
                "models": [
                  "example:small"
                ],
                "prompt": "Explique APIs REST.",
                "num_predict": 128,
                "num_ctx": 4096,
                "repetitions": 3,
                "timeout": 180,
                "think": false,
                "live_token_count": false
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Worker aceito.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StartAccepted"
                },
                "example": {
                  "status": "running"
                }
              }
            }
          },
          "409": {
            "description": "Já há job running ou cancelling.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Host/Origin/Sec-Fetch-Site rejeitado.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "400": {
            "description": "JSON, tamanho textual ou configuração inválida.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Caminho POST com query ou caminho desconhecido.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "408": {
            "description": "Timeout tratado lendo corpo.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Content-Length ausente, negativo ou acima de 65536.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Content-Type não JSON ou Transfer-Encoding não vazio.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Se presente, deve coincidir exatamente com http:// + Host; ausente é aceito."
