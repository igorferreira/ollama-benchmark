        "responses": {
          "200": {
            "description": "Anexo; nome fixo conforme formato. Pode exportar estado parcial durante execução.",
            "headers": {
              "Content-Disposition": {
                "schema": {
                  "type": "string"
                },
                "description": "attachment; filename=\"ollama-benchmark.json\" ou ollama-benchmark.csv"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/State"
                }
              },
              "text/csv": {
                "schema": {
                  "type": "string",
