  "components": {
    "securitySchemes": {
      "PageToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Benchmark-Token",
        "description": "Token da instância obtido no HTML GET /. Não representa conta/sessão individual."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "additionalProperties": false
      },
      "StartRequest": {
        "type": "object",
        "required": [
          "models",
          "prompt"
        ],
        "properties": {
          "models": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200,
              "pattern": "\\S"
            },
            "description": "Limite aplicado antes de deduplicar. Deduplicação preserva ordem; nomes não são aparados."
          },
          "prompt": {
            "type": "string",
            "minLength": 1,
            "maxLength": 16000,
            "pattern": "\\S"
          },
          "num_predict": {
            "type": "integer",
            "minimum": 1,
            "maximum": 4096,
            "default": 128,
            "x-python-type": "int (não aceita float 128.0)"
          },
          "num_ctx": {
            "type": "integer",
            "minimum": 512,
            "maximum": 131072,
            "default": 4096,
            "x-python-type": "int"
          },
          "repetitions": {
            "type": "integer",
            "minimum": 2,
            "maximum": 10,
            "default": 3,
            "x-python-type": "int",
            "description": "Inclui primeira chamada."
          },
          "timeout": {
            "type": "integer",
            "minimum": 10,
            "maximum": 1800,
            "default": 180,
            "x-python-type": "int",
            "description": "Deadline em segundos da geração; exclui GETs de metadados."
          },
          "think": {
            "type": "boolean",
            "default": false
          },
          "live_token_count": {
            "type": "boolean",
            "default": false,
            "description": "Instrumentação opcional: envia logprobs=true/top_logprobs=0 para observar tokens de saída; pode alterar desempenho e depende do Ollama/modelo. Sem retry automático."
          }
        },
        "additionalProperties": true,
        "description": "Campos extras são ignorados. Exemplo ilustrativo; substitua pelo nome de modelo instalado."
      },
      "Settings": {
        "type": "object",
        "required": [
          "models",
          "prompt",
          "num_predict",
          "num_ctx",
          "repetitions",
          "timeout",
          "think",
          "live_token_count"
        ],
        "properties": {
          "models": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200,
              "pattern": "\\S"
            },
            "description": "Limite aplicado antes de deduplicar. Deduplicação preserva ordem; nomes não são aparados."
          },
          "prompt": {
            "type": "string",
            "minLength": 1,
            "maxLength": 16000,
            "pattern": "\\S"
          },
          "num_predict": {
            "type": "integer",
            "minimum": 1,
            "maximum": 4096,
            "default": 128,
            "x-python-type": "int (não aceita float 128.0)"
          },
          "num_ctx": {
            "type": "integer",
            "minimum": 512,
            "maximum": 131072,
            "default": 4096,
            "x-python-type": "int"
          },
          "repetitions": {
            "type": "integer",
            "minimum": 2,
            "maximum": 10,
            "default": 3,
            "x-python-type": "int",
            "description": "Inclui primeira chamada."
          },
          "timeout": {
            "type": "integer",
            "minimum": 10,
            "maximum": 1800,
            "default": 180,
            "x-python-type": "int",
            "description": "Deadline em segundos da geração; exclui GETs de metadados."
          },
          "think": {
            "type": "boolean",
            "default": false
          },
          "live_token_count": {
            "type": "boolean",
            "default": false,
            "description": "Instrumentação opcional: envia logprobs=true/top_logprobs=0 para observar tokens de saída; pode alterar desempenho e depende do Ollama/modelo. Sem retry automático."
          }
        },
        "additionalProperties": false
      },
      "Row": {
        "type": "object",
        "required": [
          "model",
          "run",
          "phase",
          "status"
        ],
        "properties": {
          "model": {
            "type": "string"
          },
          "run": {
            "type": "integer",
            "minimum": 1
          },
          "phase": {
            "type": "string",
            "enum": [
              "initial",
              "repeated"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "completed",
              "failed",
              "cancelled"
            ]
          },
          "loaded_before": {
            "type": "boolean"
          },
          "tokens": {
            "type": "integer",
            "minimum": 0
          },
          "tokens_per_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "description": "eval_count / eval_duration * 1e9; null se duração não positiva ou tokens zero."
          },
          "first_content_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "description": "Relógio cliente: primeiro response ou thinking não vazio."
          },
          "first_text_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "description": "Relógio cliente: primeiro response não vazio."
          },
          "wall_s": {
            "type": "number",
            "minimum": 0,
            "description": "Duração local da geração; exclui GETs de metadados."
          },
          "total_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          },
          "load_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          },
          "prompt_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          },
          "generation_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          },
          "prompt_tokens": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "description": "Contador final prompt_eval_count normalizado: inteiro não negativo ou null."
          },
          "prompt_cached_tokens": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "description": "Subconjunto cache informado; não somar novamente ao total. Ausência/inválido vira null."
          },
          "done_reason": {
            "description": "Copiado sem revalidação; normalmente string. Default unknown se ausente."
          },
          "response": {
            "type": "string",
            "maxLength": 64000
          },
          "size_vram": {
            "description": "Valor copiado do Ollama sem revalidação de tipo; normalmente inteiro ou null."
          },
          "size_memory": {
            "description": "Valor copiado do Ollama sem revalidação de tipo; normalmente inteiro ou null."
          },
          "warning": {
            "type": "string"
          },
          "error": {
            "type": "string"
          },
          "total_tokens": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "description": "Entrada+saída somente quando ambas válidas. Não é total faturável."
          },
          "output_tokens_observed": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "description": "Soma provisória de entradas logprobs válidas na opção instrumentada; null se desativada/indisponível."
          },
          "token_observation_status": {
            "type": "string",
            "enum": [
              "disabled",
              "unavailable",
              "matched",
              "mismatch"
            ],
            "description": "Conferência com eval_count final, que sempre determina tokens. Nenhuma metadata bruta é guardada."
          }
        },
        "additionalProperties": false,
        "description": "Campos métricos estão presentes no sucesso; falha/cancelamento podem trazer só campos-base, loaded_before e error. Campos de memória/warning são opcionais."
      },
      "Summary": {
        "type": "object",
        "required": [
          "model",
          "initial",
          "repeated_count",
          "tokens_per_s",
          "first_text_s",
          "wall_s"
        ],
        "properties": {
          "model": {
            "type": "string"
          },
          "initial": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Row"
              },
              {
                "type": "null"
              }
            ]
          },
          "repeated_count": {
            "type": "integer",
            "minimum": 0
          },
          "tokens_per_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          },
          "first_text_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          },
          "wall_s": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          }
        },
        "additionalProperties": false,
        "description": "Mediana por métrica dos valores numéricos disponíveis em linhas completed run>1. repeated_count não exige velocidade disponível."
      },
      "State": {
        "type": "object",
        "required": [
          "status",
          "settings",
          "rows",
          "current",
          "started_at",
          "error",
          "summary",
          "live",
          "usage"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "idle",
              "running",
              "cancelling",
              "completed",
              "cancelled",
              "failed"
            ],
            "description": "completed significa fila percorrida, mesmo se todas as linhas falharam."
          },
          "settings": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Settings"
              },
              {
                "type": "null"
              }
            ]
          },
          "rows": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Row"
            }
          },
          "current": {
            "anyOf": [
              {
                "type": "object",
                "required": [
                  "model",
                  "run"
                ],
                "properties": {
                  "model": {
                    "type": "string"
                  },
                  "run": {
                    "type": "integer",
                    "minimum": 1
                  }
                },
                "additionalProperties": false
              },
              {
                "type": "null"
              }
            ]
          },
          "started_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "error": {
            "type": [
              "string",
              "null"
            ]
          },
          "summary": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Summary"
            }
          },
          "live": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/LiveProgress"
              },
              {
                "type": "null"
              }
            ]
          },
          "usage": {
            "$ref": "#/components/schemas/Usage"
          }
        },
        "additionalProperties": false
      },
